
name: Check JSON Submissions

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-json:
    name: Validate submitted JSON
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check JSON files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          if os.environ["EVENT_NAME"] == "pull_request":
              result = subprocess.run(
                  ["git", "diff", "--name-only",
                   os.environ["BASE_SHA"] + "..." + os.environ["HEAD_SHA"]],
                  capture_output=True, text=True, check=True
              )
              files = [
                  Path(name) for name in result.stdout.splitlines()
                  if name.lower().endswith(".json")
              ]
          else:
              files = list(Path(".").rglob("*.json"))

          errors = 0

          secret_patterns = [
              re.compile(r"\bgh[pousr]_[A-Za-z0-9_]{20,}\b"),
              re.compile(r"\bgithub_pat_[A-Za-z0-9_]{20,}\b"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"-----BEGIN .*PRIVATE KEY-----"),
          ]

          risky_markers = [
              "<script", "javascript:", "eval(",
              "new Function", "document.cookie",
              "XMLHttpRequest", "fetch("
          ]

          def inspect_strings(value, path, warnings):
              if isinstance(value, dict):
                  for item in value.values():
                      inspect_strings(item, path, warnings)
              elif isinstance(value, list):
                  for item in value:
                      inspect_strings(item, path, warnings)
              elif isinstance(value, str):
                  for pattern in secret_patterns:
                      if pattern.search(value):
                          warnings.add("Possible secret or private key")
                  lower = value.lower()
                  if any(marker.lower() in lower for marker in risky_markers):
                      warnings.add("Potentially executable or risky content")

          if not files:
              print("No JSON files to check.")
          else:
              for file in files:
                  if not file.exists():
                      continue

                  print(f"Checking: {file}")

                  if file.stat().st_size > 1024 * 1024:
                      print(f"::error file={file}::File exceeds 1 MB")
                      errors += 1
                      continue

                  try:
                      data = json.loads(file.read_text(encoding="utf-8"))
                      if not isinstance(data, dict):
                          raise ValueError("JSON root must be an object")

                      warnings = set()
                      inspect_strings(data, file, warnings)

                      for warning in sorted(warnings):
                          print(f"::warning file={file}::{warning}")

                      print(f"Valid JSON: {file}")

                  except Exception as exc:
                      print(f"::error file={file}::{exc}")
                      errors += 1

          if errors:
              raise SystemExit(f"JSON check failed: {errors} error(s)")

          print("JSON checks completed.")
          PY
